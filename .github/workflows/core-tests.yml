name: Core tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keyboard-core:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record Swift toolchain
        run: swift --version
      - name: Test KeyboardCore
        run: swift test
      - name: Test local build configuration parser
        run: python3 -m unittest discover -s Scripts/tests
