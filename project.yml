name: ScriptKeyboard
options:
  bundleIdPrefix: org.example
  deploymentTarget:
    iOS: '27.0'
  xcodeVersion: '27.1'
  createIntermediateGroups: true
packages:
  ScriptKeyboardCore:
    path: .
configFiles:
  Debug: Configuration/Build.xcconfig
  Release: Configuration/Build.xcconfig
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.1.0'
    CURRENT_PROJECT_VERSION: '18'
    SUPPORTS_MACCATALYST: NO
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  ScriptKeyboard:
    type: application
    platform: iOS
    sources:
      - App
      - Sources/KeyboardUI
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: ScriptKeyboardCore
        product: KeyboardCore
      - target: ScriptKeyboardExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TABFORGE_BUNDLE_IDENTIFIER)
        INFOPLIST_FILE: Configuration/App-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Configuration/App-Info.plist
      properties:
        CFBundleDisplayName: TabForge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [tabforge]
        NSMicrophoneUsageDescription: Record speech when you start voice-to-code in the playground.
        NSSpeechRecognitionUsageDescription: Turn your speech into code in the playground using on-device recognition.
  ScriptKeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - KeyboardExtension
      - Sources/KeyboardUI
    dependencies:
      - package: ScriptKeyboardCore
        product: KeyboardCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TABFORGE_BUNDLE_IDENTIFIER).Keyboard
        INFOPLIST_FILE: Configuration/Keyboard-Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Configuration/Keyboard-Info.plist
      properties:
        CFBundleDisplayName: TabForge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
  ScriptKeyboardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - UnitTests
      - path: Configuration/TipJar.storekit
        buildPhase: resources
    dependencies:
      - target: ScriptKeyboard
      - package: ScriptKeyboardCore
        product: KeyboardCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TABFORGE_BUNDLE_IDENTIFIER).Tests
        GENERATE_INFOPLIST_FILE: YES
  ScriptKeyboardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
      - path: Configuration/TipJar.storekit
        buildPhase: resources
    dependencies:
      - target: ScriptKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TABFORGE_BUNDLE_IDENTIFIER).UITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ScriptKeyboard:
    build:
      targets:
        ScriptKeyboard: all
        ScriptKeyboardExtension: all
    test:
      targets:
        - name: ScriptKeyboardTests
          skippedTests: [TipStoreKitTests]
        - name: ScriptKeyboardUITests
          skippedTests: [TipJarUITests]
  ScriptKeyboard-Tips:
    build:
      targets:
        ScriptKeyboard: all
        ScriptKeyboardExtension: all
    run:
      config: Debug
      storeKitConfiguration: Configuration/TipJar.storekit
    test:
      testPlans:
        - path: TipJar.xctestplan
          defaultPlan: true
